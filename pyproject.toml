# ⛔ THIS FILE USED TO BE TOOLING CONFIG ONLY, and its own opening comment said the package "needs
# no build step or install". That was true of the CODE and false of the EXPERIENCE: `pip install .`
# produced a distribution called `fullcircle 0.0.0` with no `__init__.py`, so `import fullcircle`
# gave an implicit namespace package with `__file__ = None`, nothing importable from the top level,
# and no command to type. Measured 2026-09-27. "It needs no install" is not the same as "installing
# it works", and only the second one matters to somebody who downloads it.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "full-circle-optimization"
version = "0.1.0"
description = "Find what a system PROMISES but does not do -- then fix it safely, and prove the fix."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chris Shearer" }]
keywords = ["static-analysis", "mutation-testing", "sarif", "dead-code", "ci", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
# Standard library only, and deliberately so: a tool that audits other people's systems should not
# drag a dependency tree into them.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "coverage>=7"]

# ⭐ THE CONSOLE SCRIPT. There was nothing to type after installing; you had to already know to run
# `python3 fullcircle/orchestrator.py`. `python3 -m fullcircle` and the per-module script form both
# still work, so nothing that already used either breaks.
[project.scripts]
# ⛔ IT POINTS AT `cli`, NOT `main`, SINCE 2026-09-28 -- AND THE DIFFERENCE IS A BUG, NOT STYLE.
# `main` lets an internal exception escape, and an escaping exception makes the interpreter exit 1,
# which is this tool's own documented code for "it looked, and found something". So a TypeError
# inside `--sarif` wrote a zero-byte file and exited with the code for a successful finding: a CI
# job, a test asserting "nonzero means findings", and a person skimming a terminal each read it as
# a working run. `cli` catches it and returns 2 (COULD NOT TELL). `main` stays
# exception-transparent on purpose, so the test suite sees real tracebacks instead of exit codes.
fullcircle = "fullcircle.__main__:cli"

[project.urls]
Repository = "https://github.com/Cshearer210/full-circle-optimization"

[tool.setuptools]
packages = ["fullcircle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["fullcircle"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F/W are the correctness basics -- unused imports, undefined names, obvious mistakes -- so the
# lint step is a real signal. The style rules that fire on this codebase's DELIBERATE conventions
# are turned off rather than churned away.
select = ["E", "F", "W"]
ignore = [
    "E501",  # long lines: some tabular comments and inline fixtures run past 100 on purpose
    "E741",  # a couple of SARIF-location loops mirror the dict key `l`
    "E702",  # the module selftests use `print(...); ok = False` one-liners throughout, by design
    "E401",  # `import tempfile, shutil` grouping in selftests, by design
    "E402",  # a few modules insert the repo root on sys.path before importing the package
]

[tool.ruff.lint.per-file-ignores]
# tests build tiny Python source strings and re-import modules under aliases on purpose.
"tests/*" = ["F811"]
